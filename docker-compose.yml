services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    restart: unless-stopped
    ports:
      - "5069:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__ExchangeName: capstone.audio
      RabbitMQ__RoutingKey: audio.uploaded
      RabbitMQ__ProcessedQueueName: audio.processed.api
      RabbitMQ__ProcessedRoutingKey: audio.processed
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__BucketName: audio
      ConnectionStrings__DefaultConnection: Host=postgres;Database=capstone_audio;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started

  validator:
    build:
      context: .
      dockerfile: Dockerfile.validator
    container_name: capstone-validator
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__ExchangeName: capstone.audio
      RabbitMQ__RoutingKey: audio.uploaded
      RabbitMQ__ValidatedRoutingKey: audio.validated
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__BucketName: audio
      MinIO__UseSsl: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=capstone_audio;Username=postgres;Password=postgres
      Validator__MaxConcurrency: "4"
      Validator__ShutdownTimeoutSeconds: "15"
      Validator__PollIntervalMs: "500"

  compressor:
    build:
      context: .
      dockerfile: Dockerfile.compressor
    container_name: capstone-compressor
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      minio:
        condition: service_started
      validator:
        condition: service_started
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__ExchangeName: capstone.audio
      RabbitMQ__RoutingKey: audio.validated
      RabbitMQ__CompressedRoutingKey: audio.compressed
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__BucketName: audio
      MinIO__UseSsl: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=capstone_audio;Username=postgres;Password=postgres
      FFmpeg__FfmpegPath: ffmpeg
      Compressor__MaxConcurrency: "4"
      Compressor__ShutdownTimeoutSeconds: "15"
      Compressor__PollIntervalMs: "500"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: capstone-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      minio:
        condition: service_started
      compressor:
        condition: service_started
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__ExchangeName: capstone.audio
      RabbitMQ__RoutingKey: audio.compressed
      RabbitMQ__ProcessedRoutingKey: audio.processed
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__UseSsl: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=capstone_audio;Username=postgres;Password=postgres
      Model__QwenPath: /models/qwen2.5-0.5b-instruct-q8_0.gguf
      Model__WhisperModelPath: /models/ggml-tiny.bin
      FFmpeg__FfmpegPath: ffmpeg
      Transcriber__MaxConcurrency: "2"
      Transcriber__ShutdownTimeoutSeconds: "15"
      Transcriber__PollIntervalMs: "500"
    volumes:
      # Read-only mount of the local model files (not baked into the image).
      - ./services/Capstone.Transcriber/models:/models:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: capstone-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: capstone-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone_audio
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: capstone-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: capstone-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
