services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    restart: unless-stopped
    ports:
      - "5069:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__BucketName: audio
      ConnectionStrings__DefaultConnection: Host=postgres;Database=capstone_audio;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: capstone-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone_audio
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: capstone-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
