<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capstone Audio Upload</title>
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme (FOUC).
         Setting data-theme also flips color-scheme via the CSS rule in variables.css. -->
    <script>
      const storedTheme = localStorage.getItem('capstone-theme')
      if (storedTheme === 'light' || storedTheme === 'dark') {
        document.documentElement.dataset.theme = storedTheme
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
